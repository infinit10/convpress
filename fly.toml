# fly.toml app configuration file generated for convpress on 2026-02-23T21:27:15+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'convpress'
primary_region = 'bom'

[build]
  dockerfile = './Dockerfile.backend'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
